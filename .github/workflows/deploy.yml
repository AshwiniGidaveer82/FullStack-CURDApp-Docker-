name: CI Pipeline (No Secrets)

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout Code
      - name: Checkout Code
        uses: actions/checkout@v3

      # 2️⃣ Setup Node (IMPORTANT for Angular)
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 20

      # 3️⃣ Build Backend
      - name: Build Backend
        run: |
          cd backend
          npm install
          npm run build || echo "No build script, skipping"

      # 4️⃣ Build Frontend
      - name: Build Frontend
        run: |
          cd frontend
          npm install
          npm run build -- --configuration production

      # 5️⃣ Build Docker Images (No Push)
      - name: Build Backend Docker Image
        run: docker build -t backend ./backend

      - name: Build Frontend Docker Image
        run: docker build -t frontend ./frontend

      # 6️⃣ Success Message
      - name: Done
        run: echo "CI Pipeline completed successfully 🚀"
